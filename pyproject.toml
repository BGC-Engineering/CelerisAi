[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celerisai"
version = "0.1.0"
description = "CelerisAi: Python-Taichi nearshore wave modeling framework"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Willington Renteria" }]
dependencies = [
    "imageio==2.36.0",
    "matplotlib==3.7.2",
    "numpy==1.24.3",
    "scipy==1.9.0",
    "taichi==1.7.4",
]

[tool.setuptools]
packages = ["celeris"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_decorators = false

# Upstream modules predate type checking; only new modules are checked.
[[tool.mypy.overrides]]
module = ["celeris.domain", "celeris.runner", "celeris.solver", "celeris.utils"]
follow_imports = "skip"
ignore_errors = true

