[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celerisai"
version = "0.1.0"
description = "CelerisAi: Python-Taichi nearshore wave modeling framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Willington Renteria" }]
# Lower bounds only. The previous exact pins (numpy==1.24.3, scipy==1.9.0,
# matplotlib==3.7.2) and the <3.12 cap forced a legacy environment; taichi 1.7.4
# in fact ships cp312 wheels and runs on numpy 2, so the ceilings are dropped to
# let CelerisAi install into a modern stack (Python 3.12, numpy 2).
dependencies = [
    "contextily>=1.7.0",
    "imageio>=2.36.0",
    "matplotlib>=3.7.2",
    "netcdf4>=1.7",
    "numpy>=1.24",
    "pyproj>=3.7.1",
    "scipy>=1.9",
    "taichi>=1.7.4",
    "xarray>=2024.1",
]

[tool.setuptools]
packages = ["celeris"]

[dependency-groups]
dev = [
    "click>=8.1",
    "joblib>=1.5.3",
    "loguru>=0.7.3",
    "mypy>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pytest>=9.0.3",
    "pyvista>=0.48.4",
    "ruff>=0.15.17",
    "tqdm>=4.68.2",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_decorators = false

# Upstream modules predate type checking; only new modules are checked.
[[tool.mypy.overrides]]
module = ["celeris.domain", "celeris.runner", "celeris.solver", "celeris.utils"]
follow_imports = "skip"
ignore_errors = true

